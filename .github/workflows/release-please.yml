---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length
# yamllint disable rule:comments
name: release-please
on:
  push:
    branches:
      - dev
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT (not the default GITHUB_TOKEN) so the tag + GitHub release
          # release-please creates on merge can trigger the tag-driven Release
          # workflow (release.yml), and so the promotion step below can push to
          # main. The default GITHUB_TOKEN deliberately cannot trigger other
          # workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # dev is the integration branch: PRs merge into dev and release-please
          # tracks its commits, opening the Release PR against dev.
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # On release, promote the exact released commit (Cargo.toml/Cargo.lock
      # bump + CHANGELOG) from dev to main, so main always points at the latest
      # released commit. github.sha is that released commit (the merge of the
      # release PR into dev), and main is a strict ancestor of it, so the push
      # is a fast-forward.
      #
      # fetch-depth MUST be 0 (full history). git verifies the fast-forward
      # client-side against the remote tip it learns during the push; a shallow
      # depth-1 checkout lacks the current main commit, so the push is rejected
      # with "remote contains work that you do not have locally". Full history
      # lets git see main is an ancestor and accept the fast-forward. Pushing a
      # branch (not a tag) does not re-trigger release.yml.
      - name: Checkout released commit
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Promote release to main
        if: ${{ steps.release.outputs.release_created }}
        run: git push origin HEAD:refs/heads/main
