---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length
# yamllint disable rule:comments
name: Release
# The GitHub release and its tag are created by release-please (see
# release-please.yml). Because release-please authenticates with a PAT, the tag
# it pushes triggers this workflow, which then builds and attaches the binaries
# to the release release-please already created.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: write
jobs:
  # All builds run on the free 1x ubuntu runner and cross-compile (via
  # actions-rust-cross, which uses `cross`/Docker as needed), so private repos
  # never spend on the 2x (Windows) or 10x (macOS) runner multipliers. macOS is
  # intentionally omitted: it can't be cross-compiled from Linux, so the
  # installer builds it from source instead.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
          - target: x86_64-pc-windows-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.target }}
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          toolchain: stable
          args: "--release --locked"
          strip: true

      - name: Package
        run: |
          name="gitid-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$name"
          cp README.md "$name"/
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/gitid.exe" "$name"/
              zip -r "${name}.zip" "$name"
              echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
              ;;
            *)
              cp "target/${{ matrix.target }}/release/gitid" "$name"/
              tar czf "${name}.tar.gz" "$name"
              echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$ASSET" --clobber
