---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length
# yamllint disable rule:comments
name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: write
jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --verify-tag

  # All builds run on the free 1x ubuntu runner and cross-compile, so private
  # repos never spend on the 2x (Windows) or 10x (macOS) runner multipliers.
  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-pc-windows-gnu
            apt: gcc-mingw-w64-x86-64
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install cross toolchain
        run: |
          if [ -n "${{ matrix.apt }}" ]; then
            sudo apt-get update
            sudo apt-get install -y "${{ matrix.apt }}"
          fi
          rustup target add "${{ matrix.target }}"

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package
        run: |
          name="gitid-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$name"
          cp README.md "$name"/
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/gitid.exe" "$name"/
              zip -r "${name}.zip" "$name"
              echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
              ;;
            *)
              cp "target/${{ matrix.target }}/release/gitid" "$name"/
              tar czf "${name}.tar.gz" "$name"
              echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$ASSET" --clobber
