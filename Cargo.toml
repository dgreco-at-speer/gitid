[package]
name = "gitid"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
description = "Switch between git identities (config, SSH keys, signing, gh auth) per directory"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
serde = { version = "1", features = ["derive"] }
toml_edit = { version = "0.23", features = ["serde"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
thiserror = "2"
inquire = "0.9"
owo-colors = { version = "4", features = ["supports-colors"] }
comfy-table = { version = "7", default-features = false, features = [
  "custom_styling",
] }
indicatif = "0.17"
etcetera = "0.11"
# SSH agent connectivity (`ssh.agent` profile keys). `ssh-key` matches the
# version ssh-agent-client-rs uses so the types unify.
ssh-agent-client-rs = "1.1"
ssh-key = "0.6"
tempfile = "3"
self-replace = "1"
# MCP server (`gitid mcp serve`). `server`/`macros` are rmcp defaults; add the
# stdio (child-process) transport. `schemars` must match rmcp's (^1.1).
rmcp = { version = "0.11", features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = [
  "rt",
  "io-std",
  "macros",
  "sync",
  "time",
  "net",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
